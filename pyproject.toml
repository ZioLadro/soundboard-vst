[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soundboard-vst"
version = "0.3.1"
description = "Soundboard stile Discord con mixer, host VST3 e uscita verso un microfono virtuale"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "sounddevice>=0.4.6",
    "pedalboard>=0.9.10",
    "numpy>=1.26",
    "python-rtmidi>=1.5.8; platform_system != 'Linux' and python_version < '3.13'",
    "discord.py[voice]>=2.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
soundboard-vst = "soundboard_vst.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
