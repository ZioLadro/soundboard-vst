name: Build release

# Costruisce SoundboardVST.exe per Windows e lo allega alla release.
# - Parte da sola quando pubblichi una release su GitHub.
# - Si può lanciare a mano (Actions → Build release → Run workflow) per una release già esistente.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release da compilare (es. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # vuoto per i push su main: si compila e si verifica senza allegare a una release
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag || '' }}
      LABEL: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag || format('main-{0}', github.sha) }}
    steps:
      - name: Script di build (dal ramo del workflow)
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Codice della release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller

      - name: PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name SoundboardVST
          --paths app/src
          --collect-all pedalboard
          --collect-submodules soundboard_vst
          --collect-all rtmidi
          --collect-all discord
          --collect-all davey
          --collect-all nacl
          tools/packaging/launch.py

      - name: Self-test dell'eseguibile
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/SoundboardVST/SoundboardVST.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test fallito (codice $($p.ExitCode))" }

      - name: Archivio zip
        shell: pwsh
        run: |
          Copy-Item app/README.md, app/CHANGELOG.md dist/SoundboardVST/
          Compress-Archive -Path dist/SoundboardVST -DestinationPath "SoundboardVST-$env:LABEL-windows-x64.zip"

      - name: Artefatto della build
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: SoundboardVST-windows-x64
          path: SoundboardVST-${{ env.LABEL }}-windows-x64.zip
          retention-days: 14

      - name: Allega alla release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: SoundboardVST-${{ env.TAG }}-windows-x64.zip
